---
# =============================================================================
# NFD (Node Feature Discovery) — auto-labels nodes with hardware capabilities
# =============================================================================
# Deploys NFD as a DaemonSet via Helm. Once running, every node gets labels like:
#   feature.node.kubernetes.io/cpu-security.amx.enabled=true
#   feature.node.kubernetes.io/cpu-cpuid.AVX512F=true
#   feature.node.kubernetes.io/memory-numa.node_count=2
#
# These labels are consumed by model-manager nodeAffinity rules (e.g. require_amx).
# =============================================================================

nfd_enabled: true
nfd_namespace: "node-feature-discovery"
nfd_helm_repo: "https://kubernetes-sigs.github.io/node-feature-discovery/charts"
nfd_helm_repo_name: "nfd"
nfd_helm_chart: "nfd/node-feature-discovery"
nfd_version: "0.17.1"

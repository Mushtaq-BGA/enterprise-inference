---
# =============================================================================
# NFD — Teardown
# =============================================================================

- name: "nfd | teardown | Remove Helm release"
  kubernetes.core.helm:
    name: node-feature-discovery
    release_namespace: "{{ nfd_namespace }}"
    state: absent
    wait: true
  failed_when: false

- name: "nfd | teardown | Remove namespace"
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Namespace
    name: "{{ nfd_namespace }}"
  failed_when: false

- name: "nfd | teardown | Remove Helm repo"
  kubernetes.core.helm_repository:
    name: "{{ nfd_helm_repo_name }}"
    state: absent
  failed_when: false

- name: "nfd | teardown | Complete"
  ansible.builtin.debug:
    msg: "NFD removed from namespace '{{ nfd_namespace }}'"
